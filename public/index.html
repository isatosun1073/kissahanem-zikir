<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kıssahanem Zikir Halkası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Noto Serif',Georgia,serif;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(3,5,20,.86);color:#f4e2b0;text-align:center;padding:24px;z-index:5}
  #start h1{margin:0;font-size:28px}
  #start p{margin:0;color:#cfc3a0;font-size:15px;max-width:420px;line-height:1.5}
  #start button{background:linear-gradient(#e9c46a,#b8862e);color:#1a1006;border:0;border-radius:14px;padding:14px 30px;font:700 19px 'Noto Serif',serif;cursor:pointer}
  #test{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:none;flex-wrap:wrap;justify-content:center;gap:6px;max-width:96vw;z-index:4;background:rgba(0,0,0,.6);padding:8px;border-radius:12px}
  #test button{background:#1d2340;color:#f4e2b0;border:1px solid #c9a54a;border-radius:8px;padding:6px 9px;font:600 12px system-ui;cursor:pointer}
  #test button.on{background:#c9a54a;color:#111}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<div id="start">
  <h1>🤲 Zikir Halkası</h1>
  <p id="startInfo"></p>
  <button id="go">Başlat</button>
</div>

<div id="test">
  <button data-a="zikir">Zikir yaz</button>
  <button data-a="like">Beğeni ×100</button>
  <button data-c="1">🌹 1 jeton</button>
  <button data-c="10">🫰 10</button>
  <button data-c="100">🤲 100</button>
  <button data-c="500">🌙 500</button>
  <button data-c="1000">🌌 1000</button>
  <button data-c="5000">🦁 5000</button>
  <button data-a="dua">🔊 Sesli dua</button>
  <button data-a="demo" id="demoBtn">Otomatik demo</button>
  <button data-a="hide">Gizle</button>
</div>

<script src="sesler.js"></script>
<script>
// ================== AYARLAR ==================
const W = 720, H = 1280;
const PARAMS = new URLSearchParams(location.search);
const LIVE = PARAMS.has('canli');

// Jetona göre olay seviyeleri
const TIERS = [
  { min: 5000, lvl: 6, zikir: 3333, dur: 13 },
  { min: 1000, lvl: 5, zikir: 1000, dur: 10 },
  { min: 500,  lvl: 4, zikir: 333,  dur: 8 },
  { min: 100,  lvl: 3, zikir: 99,   dur: 7 },
  { min: 10,   lvl: 2, zikir: 33,   dur: 5.5 },
  { min: 1,    lvl: 1, zikir: 10,   dur: 4 },
];
const DUA_SMALL = ['Allah razı olsun', 'Rabbim kabul etsin', 'Hayırlara vesile olsun', 'Allah bereket versin', 'Rabbim gönlünü ferah etsin'];
const DUA_BIG = [
  'Rabbim gönlüne huzur, evine bereket versin',
  'Allah seni ve aileni her türlü kötülükten korusun',
  'Rabbim dualarını kabul etsin, hayırlı muradına erdirsin',
  'Allah sağlık, sıhhat ve helal rızık versin',
  'Rabbim kalbini imanla, yüzünü nurla doldursun',
  'Allah sevdiklerinle birlikte cennetinde buluştursun',
  'Rabbim yolunu açık, işlerini kolay eylesin',
];
const DUA_HUGE = [
  'Rabbim bu güzelliğini kat kat mükâfatlandırsın; seni, aileni ve sevdiklerini dünyada ve ahirette mutlu etsin.',
  'Allah ömrünü hayırlı, rızkını bol, kalbini huzurlu eylesin; duanı arşa ulaştırsın.',
];
const AYETLER = [
  ['Bilesiniz ki kalpler ancak Allah\'ı anmakla huzur bulur.', 'Ra\'d Suresi, 28'],
  ['Siz beni anın ki ben de sizi anayım.', 'Bakara Suresi, 152'],
  ['Bana dua edin, size icabet edeyim.', 'Mü\'min Suresi, 60'],
  ['Allah\'ı çokça anın ki kurtuluşa eresiniz.', 'Cuma Suresi, 10'],
  ['Kullarım beni sana sorarsa, ben çok yakınım.', 'Bakara Suresi, 186'],
];
const ZIKIRLER = [
  [/S[UÜ]BHANALLAH|SUBHANALLAH|SÜPHANALLAH|SUPHANALLAH/, 'Subhanallah'],
  [/ELHAMD[UÜ]L[İI]LLAH/, 'Elhamdülillah'],
  [/ALLAHU?EKBER|ALLAHÜEKBER/, 'Allahu Ekber'],
  [/LA[İI]LAHE[İI]LLALLAH|LAİLAHEİLLALLAH/, 'Lâ ilâhe illallah'],
  [/ESTA[ĞG]F[İI]RULLAH/, 'Estağfirullah'],
  [/MA[ŞS]ALLAH/, 'Maşallah'],
  [/ALLAHÜMMESALL[İI]|SALAVAT/, 'Salavat'],
  [/^AM[İI]N$|AM[İI]N/, 'Âmin'],
];
const GOALS = [33, 99, 333, 1000, 3333, 10000, 33333, 100000];

// ================== TUVAL ==================
const cv = document.getElementById('c'), c = cv.getContext('2d');
cv.width = W; cv.height = H;
function fit() { const w = Math.min(innerWidth, innerHeight * 9 / 16); cv.style.width = w + 'px'; cv.style.height = (w * 16 / 9) + 'px'; }
addEventListener('resize', fit); fit();

const rnd = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rr(x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function shade(hex, a) { const n = parseInt(hex.slice(1), 16); const f = v => clamp(v + a, 0, 255); return `rgb(${f(n >> 16)},${f(n >> 8 & 255)},${f(n & 255)})`; }
function wrap(text, maxW) { const words = text.split(' '); const lines = []; let cur = ''; for (const w of words) { const t = cur ? cur + ' ' + w : w; if (c.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; } if (cur) lines.push(cur); return lines; }
function cut(s, n) { s = String(s || ''); return s.length > n ? s.slice(0, n - 1) + '…' : s; }

// ================== DURUM ==================
const ROBES = ['#2a2f55', '#3a2a4a', '#1f3a3a', '#4a3a2a', '#e8e0c8', '#2a4a6a', '#5a2a2a', '#2f4a2f', '#6a5a8a', '#f2ecdc'];
const HIJABS = ['#e9e4f0', '#3a3f6a', '#6a2a3a', '#2a5a5a', '#c9b48a', '#f4efe6', '#4a2a5a'];
const SKINS = ['#e8b994', '#d9a57c', '#b67d55', '#f1c9a5', '#9a6a48'];
let people = [], byId = {}, seq = 0;
let count = 0, likeAcc = 0, beadRot = 0, beadBoost = 0, beadName = null, beadNameT = 0;
let floats = [], petals = [], nurRain = [], shooting = [], toasts = [], duaQ = [], dua = null;
let handsUp = 0, skyOpen = 0, nurFlash = 0, standUp = 0, totals = {}, sultan = null, goalIdx = 0;
let connStatus = LIVE ? 'Sunucuya bağlanıyor…' : 'Önizleme modu', connT = 6;
const kandils = [0, 1, 2, 3, 4].map(i => ({ x: W * (.1 + i * .2), len: 40 + (i % 2) * 34, name: null, lit: 0, ph: i * 1.3 }));
const stars = Array.from({ length: 140 }, () => ({ x: Math.random() * W, y: Math.random() * H * .5, r: Math.random() * 1.7 + .3, p: Math.random() * 6 }));

function getPerson(id, name) {
  let p = byId[id];
  if (p) { if (name) p.name = name; p.last = performance.now(); return p; }
  const female = Math.random() < .4;
  p = { id, name: name || id, female, robe: rnd(ROBES), hijab: rnd(HIJABS), skin: rnd(SKINS), sarik: Math.random() < .5, beard: Math.random() < .6,
        ph: Math.random() * 6, nur: 0, talk: 0, gift: 0, seq: seq++, last: performance.now(),
        x: W / 2 + (Math.random() - .5) * 300, y: H + 80, s: 1.2 };
  byId[id] = p; people.push(p); trim(); return p;
}
function trim() {
  const MAX = 42;
  while (people.length > MAX) {
    const pool = people.filter(p => p.gift === 0);
    const list = pool.length ? pool : people;
    const old = list.reduce((a, b) => a.last < b.last ? a : b);
    people.splice(people.indexOf(old), 1); delete byId[old.id];
  }
}

// ================== OLAYLAR ==================
function onChat(id, name, text) {
  const t = String(text || '').toLocaleUpperCase('tr-TR').replace(/[^A-ZÇĞİÖŞÜÂÎÛ]/g, '');
  if (t === 'KADIN' || t === 'KIZ') { const p = getPerson(id, name); p.female = true; p.talk = 1.5; return; }
  if (t === 'ERKEK') { const p = getPerson(id, name); p.female = false; p.talk = 1.5; return; }
  const z = ZIKIRLER.find(([re]) => re.test(t));
  if (!z) return;
  const p = getPerson(id, name);
  p.talk = 2; floats.push({ p, txt: z[1], t: 0 });
  addCount(1); sfx.zikir();
}
function onLike(id, name, n) {
  likeAcc += n;
  while (likeAcc >= 100) { likeAcc -= 100; beadBoost = Math.max(beadBoost, .4); addCount(1); }
}
function onFollow(id, name) { toast(`💚 ${cut(name, 18)} takip etti — Allah razı olsun`); }

function onGift(id, name, coins, giftName) {
  coins = Math.max(1, Math.round(coins || 1));
  const T = TIERS.find(t => coins >= t.min);
  const p = getPerson(id, name);
  p.gift += coins; p.nur = Math.max(p.nur, 4 + T.lvl); p.talk = 2;
  totals[id] = { name: p.name, coins: (totals[id]?.coins || 0) + coins };
  sfx.gift(T.lvl);

  if (T.lvl === 1) { toast(`🤲 ${cut(p.name, 16)}: ${rnd(DUA_SMALL)}`); addCount(T.zikir); return; }
  if (T.lvl >= 2) { beadBoost = 1; beadName = p.name; beadNameT = 4; }
  if (T.lvl >= 3) { lightKandil(p.name); for (let i = 0; i < 70; i++) petals.push({ x: Math.random() * W, y: -Math.random() * 400, v: 1 + Math.random() * 2, a: Math.random() * 6, s: .7 + Math.random() * .7 }); }
  if (T.lvl >= 4) { skyOpen = T.dur; for (let i = 0; i < 4; i++) shooting.push(newShooting(i * .5)); }
  if (T.lvl >= 5) { for (let i = 0; i < 160; i++) nurRain.push({ x: Math.random() * W, y: -Math.random() * H, v: 1.5 + Math.random() * 2.5, r: 1 + Math.random() * 2.5 }); nurFlash = 1; }
  if (T.lvl >= 6) { standUp = T.dur; const top = Object.values(totals).sort((a, b) => b.coins - a.coins)[0]; sultan = top ? top.name : p.name; }

  const text = T.lvl >= 5 ? rnd(DUA_HUGE) : rnd(DUA_BIG);
  duaQ.push({ kind: 'dua', name: p.name, gift: giftName || 'Hediye', coins, lvl: T.lvl, text, dur: T.dur, t: 0 });
  if (T.lvl >= 6) { const a = rnd(AYETLER); duaQ.push({ kind: 'ayet', text: a[0], ref: a[1], lvl: 6, dur: 7, t: 0 }); }
  addCount(T.zikir);
}
function addCount(n) {
  count += n;
  while (goalIdx < GOALS.length && count >= GOALS[goalIdx]) {
    const g = GOALS[goalIdx++]; const a = AYETLER[goalIdx % AYETLER.length];
    nurFlash = Math.max(nurFlash, .8); sfx.gift(4);
    duaQ.push({ kind: 'ayet', text: a[0], ref: a[1], goal: g, lvl: 4, dur: 7, t: 0 });
  }
}
function lightKandil(name) {
  const free = kandils.find(k => !k.name);
  const target = free || kandils.reduce((a, b) => a.lit < b.lit ? a : b);
  target.name = name; target.lit = performance.now(); target.flare = 1;
}
function toast(txt) { toasts.unshift({ txt, t: 0 }); if (toasts.length > 4) toasts.length = 4; }
function newShooting(delay) { return { x: Math.random() * W * .8 + W * .2, y: Math.random() * H * .2, t: -delay, len: 120 + Math.random() * 120 }; }

// ================== ÇİZİM ==================
function drawSky(t, dt) {
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#03061a'); g.addColorStop(.45, '#0c1438'); g.addColorStop(1, '#1a1430');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  const sk = clamp(skyOpen, 0, 1);
  stars.forEach(s => { c.fillStyle = `rgba(255,248,225,${.35 + .35 * Math.sin(t * 1.6 + s.p) + sk * .3})`; c.beginPath(); c.arc(s.x, s.y, s.r * (1 + sk * .6), 0, 7); c.fill(); });
  // hilal
  const mx = W * .8, my = H * .2, mr = 34 + sk * 16;
  const mg = c.createRadialGradient(mx, my, mr * .5, mx, my, mr * (3 + sk * 3));
  mg.addColorStop(0, `rgba(255,225,150,${.35 + sk * .4})`); mg.addColorStop(1, 'rgba(255,225,150,0)');
  c.fillStyle = mg; c.beginPath(); c.arc(mx, my, mr * (3 + sk * 3), 0, 7); c.fill();
  c.fillStyle = '#f8dc95'; c.beginPath(); c.arc(mx, my, mr, 0, 7); c.fill();
  c.fillStyle = '#0a1030'; c.beginPath(); c.arc(mx + mr * .38, my - mr * .16, mr * .9, 0, 7); c.fill();
  // cami silueti
  c.fillStyle = '#070a1c';
  const by = H * .5;
  c.beginPath(); c.moveTo(0, by + 40); c.lineTo(0, by + 10); c.lineTo(W * .22, by + 10);
  c.arc(W * .32, by + 10, W * .1, Math.PI, 0); c.lineTo(W * .5, by + 10); c.arc(W * .5, by + 10, W * .14, Math.PI, 0);
  c.lineTo(W * .68, by + 10); c.arc(W * .68, by + 10, W * .08, Math.PI, 0); c.lineTo(W, by + 10); c.lineTo(W, by + 40); c.fill();
  [W * .14, W * .86].forEach(x => { c.fillRect(x - 7, by - 150, 14, 170); c.beginPath(); c.moveTo(x - 9, by - 150); c.lineTo(x, by - 195); c.lineTo(x + 9, by - 150); c.fill(); c.fillRect(x - 11, by - 95, 22, 6); });
  c.fillStyle = 'rgba(255,200,110,.5)';
  for (let i = 0; i < 6; i++) { const x = W * (.42 + i * .03); c.fillRect(x, by - 20, 6, 12); }
  // zemin
  const fg = c.createLinearGradient(0, by + 30, 0, H);
  fg.addColorStop(0, '#120e22'); fg.addColorStop(1, '#2a1a2a');
  c.fillStyle = fg; c.fillRect(0, by + 30, W, H);
  // kayan yıldızlar
  shooting = shooting.filter(s => s.t < 1.2);
  shooting.forEach(s => { s.t += dt; if (s.t < 0) return; const k = s.t / 1.2, x = s.x - k * 400, y = s.y + k * 250;
    const gr = c.createLinearGradient(x, y, x + s.len, y - s.len * .6); gr.addColorStop(0, `rgba(255,245,210,${1 - k})`); gr.addColorStop(1, 'rgba(255,245,210,0)');
    c.strokeStyle = gr; c.lineWidth = 2.5; c.beginPath(); c.moveTo(x, y); c.lineTo(x + s.len, y - s.len * .6); c.stroke(); });
  if (skyOpen > 0 && Math.random() < dt * 1.5) shooting.push(newShooting(0));
}

function drawCarpet(cx, cy, rx, ry, t) {
  const glow = c.createRadialGradient(cx, cy, 10, cx, cy, rx * 1.9);
  glow.addColorStop(0, 'rgba(255,200,110,.30)'); glow.addColorStop(1, 'rgba(255,200,110,0)');
  c.fillStyle = glow; c.fillRect(0, cy - rx * 2, W, rx * 4);
  c.fillStyle = '#5a1620'; c.beginPath(); c.ellipse(cx, cy, rx * 1.95, ry * 1.95, 0, 0, 7); c.fill();
  c.strokeStyle = '#c9a54a'; c.lineWidth = 3; c.beginPath(); c.ellipse(cx, cy, rx * 1.85, ry * 1.85, 0, 0, 7); c.stroke();
  c.strokeStyle = 'rgba(201,165,74,.5)'; c.lineWidth = 1.5; c.setLineDash([8, 6]);
  c.beginPath(); c.ellipse(cx, cy, rx * 1.55, ry * 1.55, 0, 0, 7); c.stroke(); c.setLineDash([]);
  c.fillStyle = '#7a2230'; c.beginPath(); c.ellipse(cx, cy, rx * .8, ry * .8, 0, 0, 7); c.fill();
  c.strokeStyle = '#c9a54a'; c.lineWidth = 2; c.stroke();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; c.fillStyle = '#c9a54a'; c.beginPath(); c.arc(cx + Math.cos(a) * rx * 1.7, cy + Math.sin(a) * ry * 1.7, 3, 0, 7); c.fill(); }
}

function drawTesbih(cx, cy, rx, ry, dt) {
  beadRot += dt * (.25 + beadBoost * 5); beadBoost = Math.max(0, beadBoost - dt * .5);
  const R = rx * .55, Ry = ry * .55;
  if (beadBoost > .05) { const g = c.createRadialGradient(cx, cy, 5, cx, cy, R * 1.8); g.addColorStop(0, `rgba(255,220,140,${beadBoost * .6})`); g.addColorStop(1, 'rgba(255,220,140,0)'); c.fillStyle = g; c.beginPath(); c.arc(cx, cy, R * 1.8, 0, 7); c.fill(); }
  for (let i = 0; i < 33; i++) {
    const a = i / 33 * Math.PI * 2 + beadRot, x = cx + Math.cos(a) * R, y = cy + Math.sin(a) * Ry;
    const g = c.createRadialGradient(x - 2, y - 2, 1, x, y, 7);
    g.addColorStop(0, i === 0 ? '#fff0b0' : '#b0703a'); g.addColorStop(1, i === 0 ? '#b8862e' : '#4a2410');
    c.fillStyle = g; c.beginPath(); c.arc(x, y, i === 0 ? 9 : 6.5, 0, 7); c.fill();
  }
  c.fillStyle = '#c9a54a'; c.beginPath(); c.moveTo(cx - 6, cy + Ry); c.lineTo(cx + 6, cy + Ry); c.lineTo(cx, cy + Ry + 26); c.fill();
  if (beadName && beadNameT > 0) {
    beadNameT -= dt; c.globalAlpha = clamp(beadNameT, 0, 1);
    c.font = '700 22px "Noto Serif"'; c.textAlign = 'center'; c.fillStyle = '#ffe7a8';
    c.shadowColor = '#ffb84a'; c.shadowBlur = 14; c.fillText(cut(beadName, 18), cx, cy + 8); c.shadowBlur = 0; c.globalAlpha = 1;
  }
}

function drawKandils(t, dt) {
  const now = performance.now();
  kandils.forEach(k => {
    const sw = Math.sin(t * .9 + k.ph) * 4, top = 172, y = top + k.len, x = k.x + sw;
    c.strokeStyle = '#7a6030'; c.lineWidth = 2; c.beginPath(); c.moveTo(k.x, top); c.lineTo(x, y - 18); c.stroke();
    const lit = !!k.name;
    if (lit) {
      k.flare = Math.max(0, (k.flare || 0) - dt * .4);
      const r = 70 + 12 * Math.sin(t * 7 + k.ph) + k.flare * 120;
      const g = c.createRadialGradient(x, y, 3, x, y, r); g.addColorStop(0, 'rgba(255,205,110,.85)'); g.addColorStop(1, 'rgba(255,205,110,0)');
      c.fillStyle = g; c.beginPath(); c.arc(x, y, r, 0, 7); c.fill();
    }
    c.fillStyle = '#b8862e'; c.beginPath(); c.moveTo(x - 10, y - 18); c.lineTo(x + 10, y - 18); c.lineTo(x + 5, y - 24); c.lineTo(x - 5, y - 24); c.fill();
    c.fillStyle = lit ? 'rgba(255,190,90,.9)' : 'rgba(90,110,140,.35)';
    c.beginPath(); c.moveTo(x - 10, y - 18); c.quadraticCurveTo(x - 20, y + 2, x, y + 18); c.quadraticCurveTo(x + 20, y + 2, x + 10, y - 18); c.fill();
    c.strokeStyle = '#c9a54a'; c.lineWidth = 1.5; c.stroke();
    if (lit) { c.fillStyle = '#fff6d0'; c.beginPath(); c.ellipse(x, y + 1 + Math.sin(t * 11 + k.ph), 3, 6 + Math.sin(t * 9 + k.ph), 0, 0, 7); c.fill(); }
    c.fillStyle = '#b8862e'; c.beginPath(); c.arc(x, y + 20, 3, 0, 7); c.fill();
    if (lit) {
      c.font = '700 15px "Noto Serif"'; c.textAlign = 'center';
      const nm = cut(k.name, 11), w = c.measureText(nm).width + 14;
      c.fillStyle = 'rgba(20,10,0,.6)'; rr(x - w / 2, y + 28, w, 22, 9); c.fill();
      c.fillStyle = '#ffe2a0'; c.fillText(nm, x, y + 44);
    }
  });
}

function drawPerson(p, t) {
  const s = p.s, up = handsUp > 0 || standUp > 0, talking = p.talk > 0;
  const sway = Math.sin(t * 2.3 + p.ph) * (up ? .03 : .09) * (talking ? 1.6 : 1);
  c.save(); c.translate(p.x, p.y); c.scale(s, s);
  c.fillStyle = 'rgba(0,0,0,.4)'; c.beginPath(); c.ellipse(0, 3, 34, 9, 0, 0, 7); c.fill();
  if (p.nur > 0) {
    const a = clamp(p.nur / 3, 0, 1), g = c.createRadialGradient(0, -62, 4, 0, -62, 80);
    g.addColorStop(0, `rgba(255,232,160,${.85 * a})`); g.addColorStop(1, 'rgba(255,232,160,0)');
    c.fillStyle = g; c.beginPath(); c.arc(0, -62, 80, 0, 7); c.fill();
  }
  c.rotate(sway);
  const lift = standUp > 0 ? -18 : 0;
  c.translate(0, lift);
  // dizler
  c.fillStyle = shade(p.robe, -18); c.beginPath(); c.ellipse(0, -6, 34, 11, 0, 0, 7); c.fill();
  // gövde
  const body = new Path2D(); body.moveTo(-28, -6); body.quadraticCurveTo(-27, -46, -13, -52); body.lineTo(13, -52); body.quadraticCurveTo(27, -46, 28, -6); body.closePath();

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; const t = now / 1000;
  handsUp = Math.max(0, handsUp - dt); skyOpen = Math.max(0, skyOpen - dt); standUp = Math.max(0, standUp - dt);
  drawSky(t, dt);
  const cx = W / 2, cy = H * .675, rx = W * .215, ry = H * .058;
  drawCarpet(cx, cy, rx, ry, t);
  drawKandils(t, dt);
  // halka yerleşimi
  const order = people.slice().sort((a, b) => (b.gift - a.gift) || (a.seq - b.seq));
  const RINGS = [{ n: 10, r: 1.25 }, { n: 14, r: 1.62 }, { n: 18, r: 1.98 }];
  let idx = 0;
  RINGS.forEach((R, ri) => {
    const list = order.slice(idx, idx + R.n); idx += R.n;
    list.forEach((p, k) => {
      const ang = (k / list.length) * Math.PI * 2 + ri * .22 + t * .035;
      const tx = cx + Math.cos(ang) * rx * R.r, ty = cy + Math.sin(ang) * ry * R.r;
      const ts = 1.15 + Math.sin(ang) * .17 + ri * .06;
      p.x += (tx - p.x) * Math.min(1, dt * 2.5); p.y += (ty - p.y) * Math.min(1, dt * 2.5); p.s += (ts - p.s) * Math.min(1, dt * 3);
      p.nur = Math.max(0, p.nur - dt * .35); p.talk = Math.max(0, p.talk - dt);
    });
  });
  // tesbih arkası / önü için derinlik
  const sorted = people.slice().sort((a, b) => a.y - b.y);
  const back = sorted.filter(p => p.y < cy), front = sorted.filter(p => p.y >= cy);
  back.forEach(p => drawPerson(p, t));
  drawTesbih(cx, cy, rx, ry, dt);
  front.forEach(p => drawPerson(p, t));
  sorted.forEach(drawLabel);
  floats = floats.filter(f => f.t < 2.2);
  floats.forEach(f => { f.t += dt; const a = 1 - f.t / 2.2, y = (f.p.labelY || cy) - 18 - f.t * 46;
    c.globalAlpha = a; c.font = '700 21px "Noto Serif"'; c.textAlign = 'center'; c.lineWidth = 4; c.strokeStyle = 'rgba(0,0,0,.6)';
    c.strokeText(f.txt, f.p.x, y); c.fillStyle = '#ffe7a8'; c.fillText(f.txt, f.p.x, y); c.globalAlpha = 1; });
  drawParticles(dt);
  drawHUD(t);
  drawStatus(dt);
  drawBottom(t);
  drawToasts(dt);
  if (!dua) drawDuaSub(dt);
  drawDua(dt);
  requestAnimationFrame(frame);
}

    o.connect(fl); fl.connect(g); g.connect(fxBus); o.start(t); o.stop(t + d); }); }); }
  let lastZ = 0;
  sfx.zikir = () => { const t = AC.currentTime; if (t - lastZ < .12) return; lastZ = t; bell(rnd(PENTA), t, .05, 1.4); };
  sfx.gift = (lvl) => { const t = AC.currentTime;
    const n = Math.min(2 + lvl * 2, 12); for (let i = 0; i < n; i++) bell(PENTA[i % PENTA.length] * (i >= 6 ? 2 : 1) / (lvl >= 4 ? 2 : 1), t + i * .09, .09 + lvl * .015);
    if (lvl >= 3) pad([146.83, 220, 293.66, 369.99], t, 3 + lvl, .012 + lvl * .004);
    if (lvl >= 5) pad([73.42, 110, 146.83], t + .5, 8, .03);
    if (lvl >= 2) voice.hediye(); };
  voice.init();
}

// ================== SESLİ DUALAR (telifsiz, Kıssahanem için üretildi) ==================
const DUA_YAZI = [
  'Allah\'ım, bu halkada seni ananları affet. Kalplerimizi zikrinle huzura kavuştur. Âmin.',
  'Rabbimiz, bize dünyada da iyilik ver, ahirette de iyilik ver. Bizi ateş azabından koru. Âmin.',
  'Allah\'ım, duasıyla, hediyesiyle bu halkaya katılan herkesten razı ol. Evlerine bereket, gönüllerine huzur ver. Âmin.',
  'Rabbim, hastalarımıza şifa, dertlilerimize deva, borçlularımıza eda nasip eyle. Âmin.',
  'Allah\'ım, anne babalarımızı, sevdiklerimizi ve ahirete göçmüş bütün müminleri rahmetinle kucakla. Âmin.',
];
let duaSub = null;
const voice = {
  dualar: [], hediye: [], busy: false, idx: 0, hidx: 0, lastH: 0, bus: null,
  async init() {
    if (!window.SESLER) return;
    this.bus = AC.createGain(); this.bus.gain.value = 1.15; this.bus.connect(master);
    const dec = async (u) => { const b = atob(u.split(',')[1]); const a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return await AC.decodeAudioData(a.buffer); };
    try {
      this.dualar = await Promise.all(SESLER.dualar.map(dec));
      this.hediye = await Promise.all(SESLER.hediye.map(dec));
    } catch (e) { console.log('ses yüklenemedi', e); return; }
    setTimeout(() => this.duaOku(), 20000);
    setInterval(() => this.duaOku(), 75000);
  },
  play(buf, onEnd) {
    if (!buf || this.busy) return false;
    this.busy = true;
    const t = AC.currentTime;
    musicBus.gain.cancelScheduledValues(t); musicBus.gain.setTargetAtTime(.16, t, .3);
    const src = AC.createBufferSource(); src.buffer = buf; src.connect(this.bus); src.start(t + .3);
    src.onended = () => { this.busy = false; musicBus.gain.setTargetAtTime(.55, AC.currentTime, .8); onEnd && onEnd(); };
    return true;
  },
  duaOku() {
    if (!this.dualar.length) return;
    const i = this.idx % this.dualar.length;
    if (this.play(this.dualar[i], () => { duaSub = null; })) { this.idx++; duaSub = { txt: DUA_YAZI[i], t: 0 }; handsUp = Math.max(handsUp, this.dualar[i].duration + .5); }
  },
  hediye() {
    if (!this.hediye.length || AC.currentTime - this.lastH < 6) return;
    if (this.play(this.hediye[this.hidx % this.hediye.length])) { this.hidx++; this.lastH = AC.currentTime; }
  },
};

function drawDuaSub(dt) {
  if (!duaSub) return; duaSub.t += dt;
  const a = clamp(duaSub.t * 2, 0, 1);
  c.globalAlpha = a; c.font = 'italic 400 21px "Noto Serif"'; c.textAlign = 'center';
  const lines = wrap(duaSub.txt, W - 120), h = 44 + lines.length * 28, y = H * .45 - h;
  c.fillStyle = 'rgba(8,6,24,.78)'; rr(40, y, W - 80, h, 16); c.fill(); c.strokeStyle = 'rgba(233,196,106,.6)'; c.lineWidth = 1.2; c.stroke();
  c.fillStyle = '#c9a54a'; c.font = '700 15px "Noto Serif"'; c.fillText('🤲 Halkanın duası', W / 2, y + 24);
  c.fillStyle = '#fff'; c.font = 'italic 400 21px "Noto Serif"'; lines.forEach((l, i) => c.fillText(l, W / 2, y + 52 + i * 28));
  c.globalAlpha = 1;
}

// ================== BAĞLANTI ==================
function connect() {
  const ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  ws.onmessage = e => { let m; try { m = JSON.parse(e.data); } catch (_) { return; }
    if (m.type === 'chat') onChat(m.id, m.name, m.text);
    else if (m.type === 'gift') onGift(m.id, m.name, m.coins, m.gift);
    else if (m.type === 'like') onLike(m.id, m.name, m.count);
    else if (m.type === 'follow') onFollow(m.id, m.name);
    else if (m.type === 'status') { connStatus = m.text; connT = 8; } };
  ws.onclose = () => { connStatus = 'Sunucu bağlantısı koptu, yeniden bağlanıyor…'; connT = 5; setTimeout(connect, 3000); };
}
