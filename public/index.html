<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zikir Halkası">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.png">
<title>Kıssahanem Zikir Halkası</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Noto+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{--gold:#e9c46a;--gold2:#ffe7a8;--ink:#0a0d24}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Noto Serif',Georgia,serif;-webkit-user-select:none;user-select:none;color:#fff}
  #stage{position:fixed;left:50%;top:50%;width:720px;height:1280px;transform-origin:center;overflow:hidden;background:#02030c}
  #gl{position:absolute;inset:0;width:720px;height:1280px;display:block}
  .glass{background:linear-gradient(180deg,rgba(28,18,48,.78),rgba(10,12,36,.78));border:1.5px solid rgba(233,196,106,.75);box-shadow:0 0 24px rgba(233,196,106,.18),inset 0 0 0 4px rgba(233,196,106,.08);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}

  /* üst başlık */
  #hud{position:absolute;left:22px;right:22px;top:24px;border-radius:22px;padding:10px 16px 12px;text-align:center}
  #hud .ar{font-family:Amiri,serif;font-size:24px;color:var(--gold);line-height:1.1;text-shadow:0 0 12px rgba(233,196,106,.5)}
  #hud h1{margin:2px 0 0;font-size:36px;color:var(--gold2);letter-spacing:.5px;text-shadow:0 2px 10px rgba(255,190,90,.45)}
  #hud .brand{font-size:14px;color:var(--gold);opacity:.85;margin-top:-2px}
  #hud .rules{display:flex;justify-content:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{font-size:15px;font-weight:700;padding:5px 11px;border-radius:999px;background:rgba(233,196,106,.14);border:1px solid rgba(233,196,106,.5);color:#fff;white-space:nowrap}
  .chip b{color:var(--gold2)}

  /* hoş geldin */
  #welcome{position:absolute;left:22px;right:22px;top:212px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
  .wcard{display:flex;align-items:center;gap:14px;padding:9px 18px 9px 9px;border-radius:999px;animation:win .55s cubic-bezier(.2,1.4,.4,1) both;background:linear-gradient(90deg,rgba(92,40,120,.95),rgba(24,30,90,.92));border:1.5px solid var(--gold);box-shadow:0 0 30px rgba(180,120,255,.35)}
  .wcard.out{animation:wout .45s ease-in both}
  @keyframes win{from{transform:translateX(-120%) scale(.8);opacity:0}to{transform:none;opacity:1}}
  @keyframes wout{to{transform:translateX(110%);opacity:0}}
  .wcard .t1{font-size:24px;font-weight:700;color:var(--gold2);line-height:1.15}
  .wcard .t2{font-size:15px;color:#e8e4ff}
  .av{flex:none;border-radius:50%;border:3px solid var(--gold);background:#3a2a5a center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--gold2);overflow:hidden}
  .av img{width:100%;height:100%;object-fit:cover;display:block}
  .wcard .av{width:62px;height:62px;font-size:28px;box-shadow:0 0 18px rgba(233,196,106,.6)}

  /* isim etiketleri */
  #labels{position:absolute;inset:0;pointer-events:none;z-index:1;isolation:isolate}
  #hud,#welcome,#near,#feed,#dua,#sub,#bottom,#status,#veil{z-index:2}
  #dua{z-index:4} #veil{z-index:3}
  .lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:999px;background:rgba(6,8,26,.72);border:1px solid rgba(255,255,255,.25);white-space:nowrap;transform-origin:50% 100%;will-change:transform}
  .lbl .av{width:22px;height:22px;font-size:11px;border-width:1.5px}
  .lbl .n{font-size:13px;font-weight:700;color:#fff;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  .lbl .tm{font:700 11px system-ui;color:#9fe0a8;background:rgba(0,0,0,.35);padding:1px 5px;border-radius:6px}
  .lbl.gift{background:linear-gradient(90deg,rgba(130,86,14,.92),rgba(80,50,8,.92));border-color:var(--gold);box-shadow:0 0 12px rgba(233,196,106,.5)}
  .lbl.gift .n{color:var(--gold2)} .lbl.gift .tm{color:#ffd27a}
  .lbl.low{animation:low .5s infinite alternate}
  .lbl.low .tm{color:#ff8a7a}
  @keyframes low{to{border-color:#ff5a4a;box-shadow:0 0 14px #ff5a4a}}
  .lbl.kandil{background:rgba(40,20,0,.75);border-color:var(--gold)} .lbl.kandil .n{color:var(--gold2);font-size:13px}

  /* halkaya yaklaşanlar */
  #near{position:absolute;right:18px;top:300px;width:230px;border-radius:16px;padding:10px 12px;display:none}
  #near h3{margin:0 0 6px;font-size:14px;color:var(--gold)}
  .nr{display:flex;align-items:center;gap:8px;margin:6px 0}
  .nr .av{width:30px;height:30px;font-size:14px;border-width:2px}
  .nr .info{flex:1;min-width:0}
  .nr .nm{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar{height:7px;border-radius:5px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:3px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#ff5a7a,#ffb3c6);border-radius:5px;transition:width .3s}
  .nr .ct{font:700 11px system-ui;color:#ffb3c6}

  /* olay akışı */
  #feed{position:absolute;left:18px;bottom:212px;width:470px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
  .ev{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:999px;background:rgba(60,34,8,.86);border:1px solid rgba(233,196,106,.7);font-size:16px;font-weight:700;color:var(--gold2);animation:evin .35s ease-out both;max-width:100%}
  .ev .av{width:28px;height:28px;font-size:13px;border-width:1.5px}
  .ev span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ev.warn{background:rgba(90,14,14,.88);border-color:#ff7a6a;color:#ffd6d0}
  .ev.like{background:rgba(90,20,50,.86);border-color:#ff8aaa;color:#ffe0ea}
  .ev.out{animation:evout .4s ease-in both}
  @keyframes evin{from{transform:translateX(-40px);opacity:0}}
  @keyframes evout{to{opacity:0;transform:translateY(10px)}}

  /* dua kartı */
  #dua{position:absolute;left:36px;right:36px;top:330px;border-radius:26px;padding:22px 26px 24px;text-align:center;display:none}
  #dua.show{display:block;animation:dIn .6s cubic-bezier(.2,1.3,.4,1) both}
  #dua.hide{animation:dOut .5s ease-in both}
  @keyframes dIn{from{transform:scale(.6) translateY(40px);opacity:0}}
  @keyframes dOut{to{transform:scale(.9);opacity:0}}
  #dua .av{width:96px;height:96px;font-size:40px;margin:-70px auto 8px;box-shadow:0 0 40px rgba(255,210,120,.8)}
  #dua .gift{font-size:17px;color:var(--gold);font-weight:700}
  #dua .name{font-size:46px;font-weight:700;color:var(--gold2);text-shadow:0 0 22px rgba(255,184,74,.9);line-height:1.15;margin:4px 0 8px;word-break:break-word}
  #dua .text{font-size:25px;line-height:1.4}
  #dua .time{display:inline-block;margin-top:12px;font:700 16px system-ui;color:#9fe0a8;background:rgba(0,0,0,.35);padding:5px 12px;border-radius:999px}
  #dua.big{top:300px;background:linear-gradient(180deg,rgba(60,30,100,.92),rgba(20,10,40,.92))}
  #dua.big .name{font-size:58px}
  #dua.ayet .text{font-style:italic;font-size:28px}
  #dua .ref{margin-top:10px;color:var(--gold);font-weight:700}
  #veil{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,rgba(255,220,150,.10),rgba(0,0,8,.6));opacity:0;transition:opacity .6s;pointer-events:none}
  #veil.on{opacity:1}

  /* altyazı (konuşma) */
  #sub{position:absolute;left:40px;right:40px;bottom:218px;text-align:center;font-size:21px;font-style:italic;line-height:1.35;color:#fff;text-shadow:0 2px 6px #000,0 0 12px #000;opacity:0;transition:opacity .3s;pointer-events:none}
  #sub.on{opacity:1}
  #sub b{color:var(--gold2);font-style:normal}

  /* alt panel */
  #bottom{position:absolute;left:22px;right:22px;bottom:22px;border-radius:20px;padding:12px 18px 14px}
  #bottom .row{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;font-weight:700}
  #bottom .row .r{font-size:15px;color:#ffb3c6}
  #prog{height:16px;border-radius:9px;background:rgba(255,255,255,.1);overflow:hidden;margin:8px 0 10px}
  #prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,#b8862e,#ffe7a8);border-radius:9px;transition:width .4s;box-shadow:0 0 12px rgba(255,220,140,.7)}
  #info{font-size:15.5px;text-align:center;min-height:44px;transition:opacity .4s;line-height:1.45}
  #info b{color:var(--gold2)}

  #status{position:absolute;left:50%;top:200px;transform:translateX(-50%);font:600 14px system-ui;color:#9fe0a8;background:rgba(0,0,0,.7);padding:4px 12px;border-radius:10px;opacity:0;transition:opacity .5s;white-space:nowrap}
  #status.on{opacity:1}

  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(3,5,20,.9);color:#f4e2b0;text-align:center;padding:24px;z-index:5}
  #start h1{margin:0;font-size:28px}
  #start p{margin:0;color:#cfc3a0;font-size:15px;max-width:420px;line-height:1.5}
  #start button{background:linear-gradient(#e9c46a,#b8862e);color:#1a1006;border:0;border-radius:14px;padding:14px 30px;font:700 19px 'Noto Serif',serif;cursor:pointer}
  #test{position:fixed;left:50%;bottom:8px;transform:translateX(-50%);display:none;flex-wrap:wrap;justify-content:center;gap:5px;max-width:96vw;z-index:4;background:rgba(0,0,0,.65);padding:6px;border-radius:12px}
  #test button{background:#1d2340;color:#f4e2b0;border:1px solid #c9a54a;border-radius:8px;padding:5px 8px;font:600 11px system-ui;cursor:pointer}
  #test button.on{background:#c9a54a;color:#111}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="stage">
  <canvas id="gl" width="720" height="1280"></canvas>
  <div id="labels"></div>
  <div id="veil"></div>
  <div id="hud" class="glass">
    <div class="ar">أَلَا بِذِكْرِ اللّٰهِ تَطْمَئِنُّ الْقُلُوبُ</div>
    <h1>Zikir Halkası</h1>
    <div class="brand">— Kıssahanem —</div>
    <div class="rules">
      <span class="chip">❤ <b>100 beğeni</b> → halkaya otur</span>
      <span class="chip">✍️ <b>SUBHANALLAH</b> yaz</span>
      <span class="chip">🎁 Hediye → <b>daha uzun kal + dua</b></span>
    </div>
  </div>
  <div id="status"></div>
  <div id="welcome"></div>
  <div id="near" class="glass"><h3>❤ Halkaya yaklaşanlar</h3><div id="nearList"></div></div>
  <div id="feed"></div>
  <div id="sub"></div>
  <div id="dua" class="glass"></div>
  <div id="bottom" class="glass">
    <div class="row"><span id="zc">0 zikir</span><span class="r" id="lc">❤ 0 beğeni</span></div>
    <div id="prog"><i></i></div>
    <div id="info"></div>
  </div>
</div>

<div id="start">
  <h1>🤲 Zikir Halkası</h1>
  <p id="startInfo"></p>
  <button id="go">Başlat</button>
</div>

<div id="test">
  <button data-a="join">👋 Giriş</button>
  <button data-a="like">❤ ×40</button>
  <button data-a="zikir">Zikir</button>
  <button data-c="1">🌹 1</button>
  <button data-c="10">🫰 10</button>
  <button data-c="100">🤲 100</button>
  <button data-c="500">🌙 500</button>
  <button data-c="1000">🌌 1000</button>
  <button data-c="5000">🦁 5000</button>
  <button data-a="dua">🔊 Dua</button>
  <button data-a="demo" id="demoBtn">Demo</button>
  <button data-a="hide">Gizle</button>
</div>

<script src="sesler.js"></script>
<script type="module" src="oyun.js"></script>
</body>
</html>
